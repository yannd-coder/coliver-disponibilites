<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Villa Coliver — Disponibilités</title>
<style>
  :root {
    --bg: hsl(36 38% 96%); --paper: hsl(36 30% 92%); --paper-deep: hsl(32 22% 88%);
    --ink: hsl(24 30% 14%); --muted: hsl(24 12% 42%);
    --gold: hsl(32 70% 42%); --gold-dark: hsl(28 65% 38%); --gold-light: hsl(32 60% 72%);
    --green: hsl(152 26% 26%); --green-bg: hsl(150 32% 90%); --green-bd: hsl(150 25% 78%);
    --border: hsl(32 14% 84%); --card: #fff;
    --radius: 14px;
    --shadow-card: 0 1px 2px hsl(24 30% 14% / .04), 0 6px 20px hsl(24 30% 14% / .06);
    --shadow-warm: 0 6px 24px -8px hsl(32 60% 30% / .35);
    --grad-gold: linear-gradient(135deg, hsl(32 70% 42%), hsl(28 65% 38%));
    --grad-header: linear-gradient(180deg, hsl(24 30% 12%), hsl(20 28% 16%));
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Geist", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); color: var(--ink); background: linear-gradient(180deg, hsl(36 38% 96%) 0%, hsl(36 30% 92%) 100%); min-height: 100vh; padding-bottom: 70px; }
  header.hero { background: var(--grad-header); color: hsl(36 30% 92%); padding: 36px 20px 52px; }
  .hero-in { max-width: 1200px; margin: 0 auto; }
  header.hero h1 { font-family: var(--font-display); font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  header.hero h1 em { font-style: normal; color: hsl(32 75% 58%); }
  header.hero p { color: hsl(36 20% 72%); font-size: 14.5px; margin-top: 8px; max-width: 660px; line-height: 1.5; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  .searchbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: -28px; position: relative; box-shadow: var(--shadow-card); }
  .field label { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .field input { border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 11px; font-size: 15px; font-family: var(--font-body); background: #fff; color: var(--ink); }
  .field input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px hsl(32 70% 42% / .18); }
  .btn { border: 0; border-radius: 999px; padding: 11px 22px; font-size: 15px; font-weight: 600; font-family: var(--font-body); cursor: pointer; }
  .btn-primary { background: var(--grad-gold); color: hsl(36 38% 97%); box-shadow: var(--shadow-warm); transition: transform .12s ease, box-shadow .12s ease; }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 11px 6px; }
  .legend { display: flex; gap: 18px; align-items: center; font-size: 13px; color: var(--muted); margin: 18px 2px 8px; flex-wrap: wrap; }
  .chip { display: inline-block; width: 14px; height: 14px; border-radius: 5px; vertical-align: -2px; margin-right: 6px; }
  .chip.free { background: var(--green-bg); border: 1px solid var(--green-bd); }
  .chip.busy { background: var(--paper-deep); border: 1px solid var(--border); }
  .gridnav { display: flex; align-items: center; gap: 8px; margin: 12px 0 10px; }
  .gridnav .title { font-family: var(--font-display); font-size: 21px; font-weight: 600; letter-spacing: -.02em; text-transform: capitalize; flex: 1; }
  .navbtn { border: 1px solid var(--border); background: var(--card); border-radius: 10px; width: 36px; height: 36px; font-size: 17px; color: var(--ink); cursor: pointer; box-shadow: 0 1px 2px hsl(24 30% 14% / .05); }
  .navbtn:hover, .todaybtn:hover { border-color: var(--gold); color: var(--gold-dark); }
  .todaybtn { border: 1px solid var(--border); background: var(--card); border-radius: 999px; height: 36px; padding: 0 15px; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; box-shadow: 0 1px 2px hsl(24 30% 14% / .05); }
  .gridbox { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-card); }
  table.cal { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  table.cal th, table.cal td { border-bottom: 1px solid hsl(32 16% 92%); }
  th.room, td.room { position: sticky; left: 0; background: var(--card); z-index: 2; text-align: left; padding: 9px 14px; min-width: 150px; max-width: 190px; border-right: 1px solid var(--border); }
  td.room .code { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  td.room .kind { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  td.room a { font-size: 11.5px; color: var(--gold-dark); font-weight: 600; text-decoration: none; }
  td.room a:hover { text-decoration: underline; }
  th.day { font-size: 10.5px; color: var(--muted); font-weight: 500; padding: 7px 0 6px; min-width: 38px; text-align: center; }
  th.day .num { display: block; font-size: 14px; font-weight: 700; color: var(--ink); }
  th.day.we { background: hsl(36 30% 94%); }
  th.day.today .num { color: var(--gold); }
  th.month { text-align: left; font-family: var(--font-display); font-size: 13px; color: var(--gold-dark); font-weight: 600; padding: 8px 6px 0; text-transform: capitalize; }
  td.c { min-width: 38px; height: 44px; text-align: center; font-size: 11px; padding: 0; }
  td.c.free { background: var(--green-bg); color: var(--green); font-weight: 600; }
  td.c.busy { background: repeating-linear-gradient(45deg, hsl(32 22% 91%), hsl(32 22% 91%) 5px, hsl(30 18% 87%) 5px, hsl(30 18% 87%) 10px); }
  td.c.free.sel { background: hsl(150 42% 82%); box-shadow: inset 0 0 0 2px var(--gold); color: hsl(152 30% 20%); font-weight: 700; }
  td.c.dim { opacity: .35; }
  td.c.we.free { background: hsl(150 30% 87%); }
  #results { margin-top: 22px; }
  .rescard { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow-card); }
  .rescard h3 { font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 10px; }
  .optline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid hsl(32 16% 92%); }
  .optline:first-of-type { border-top: 0; }
  .seg { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); border-radius: 9px; padding: 5px 11px; font-size: 13px; font-weight: 600; }
  .arrow { color: var(--muted); }
  .tot { margin-left: auto; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .tot small { color: var(--muted); font-weight: 500; }
  .book { background: var(--grad-gold); color: hsl(36 38% 97%); border-radius: 999px; padding: 7px 15px; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; box-shadow: var(--shadow-warm); transition: transform .12s ease; }
  .book:hover { transform: translateY(-1px); }
  .combo { border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-top: 12px; background: hsl(36 38% 98%); }
  .combotitle { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--gold-dark); text-transform: uppercase; margin: 4px 0 2px; }
  .comboline { display: flex; align-items: center; gap: 10px; padding: 7px 0; flex-wrap: wrap; }
  .comboline .book { margin-left: auto; }
  .segdet { font-size: 13px; color: var(--muted); }
  .segdet strong { color: var(--ink); font-size: 14px; }
  .combototal { border-top: 1px solid hsl(32 16% 90%); margin-top: 5px; padding: 9px 0 5px; font-size: 14.5px; }
  .combototal strong { color: var(--gold-dark); font-size: 16px; }
  .alttitle { font-weight: 700; font-size: 14px; margin: 14px 0 4px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 7px; line-height: 1.45; }
  .empty { color: var(--muted); font-size: 14px; line-height: 1.5; }
  #status { font-size: 13px; color: var(--muted); margin: 10px 2px; }
  .err { color: hsl(8 70% 44%); }
  .roomrow { display: flex; gap: 9px; align-items: center; }
  .rthumb { width: 46px; height: 46px; border-radius: 9px; object-fit: cover; cursor: pointer; border: 1px solid var(--border); flex: none; }
  .rinfo { min-width: 0; }
  .rlinks { display: flex; gap: 9px; font-size: 11.5px; margin-top: 2px; }
  .rlinks a { color: var(--gold-dark); font-weight: 600; text-decoration: none; }
  .rlinks a:hover { text-decoration: underline; }
  #pmodal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: hsl(24 30% 10% / .55); backdrop-filter: blur(3px); z-index: 50; }
  .pmcard { width: 50vw; min-width: 340px; max-width: 700px; max-height: 84vh; overflow-y: auto; background: var(--card); border-radius: var(--radius); box-shadow: 0 25px 60px hsl(24 30% 14% / .4); position: relative; }
  .pmclose { position: absolute; top: 10px; right: 10px; z-index: 2; width: 32px; height: 32px; border: 0; border-radius: 999px; background: hsl(24 30% 14% / .55); color: #fff; font-size: 18px; cursor: pointer; line-height: 1; }
  .gal { position: relative; }
  .gal img { width: 100%; height: 320px; object-fit: cover; display: block; border-radius: var(--radius) var(--radius) 0 0; background: var(--paper-deep); }
  .galbtn { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; border-radius: 999px; background: hsl(36 38% 97% / .92); color: var(--ink); font-size: 18px; cursor: pointer; box-shadow: 0 2px 8px hsl(24 30% 14% / .25); }
  .galprev { left: 10px; } .galnext { right: 10px; }
  .galcount { position: absolute; bottom: 10px; right: 12px; background: hsl(24 30% 14% / .6); color: #fff; font-size: 11px; padding: 3px 9px; border-radius: 999px; }
  .pmbody-in { padding: 16px 20px 20px; }
  .pmtitle { font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
  .badges { display: flex; gap: 8px; margin: 9px 0 12px; flex-wrap: wrap; }
  .badge { background: var(--paper); border: 1px solid var(--border); border-radius: 999px; padding: 3px 11px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .pmdesc { font-size: 13.5px; line-height: 1.55; color: hsl(24 20% 25%); }
  .pmdesc h3 { font-family: var(--font-display); font-size: 16px; margin: 12px 0 4px; }
  .pmdesc p, .pmdesc ul { margin: 6px 0; }
  .pmdesc ul { padding-left: 18px; }
  .pmload { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 14px; }
  .pmfoot { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
  @media (max-width: 640px) {
    header.hero { padding: 24px 16px 44px; }
    header.hero h1 { font-size: 25px; }
    .wrap { padding: 0 12px; }
    .searchbar { padding: 12px; gap: 10px; }
    .field { flex: 1 1 40%; }
    .field input { width: 100%; }
    .btn-primary { flex: 1 1 100%; }
    th.room, td.room { min-width: 98px; max-width: 114px; padding: 6px 8px; }
    td.room .kind { display: none; }
    td.room .code { font-size: 12.5px; }
    .roomrow { gap: 7px; }
    .rthumb { width: 30px; height: 30px; border-radius: 7px; }
    .rlinks a.rbook { display: none; }
    th.day { min-width: 36px; }
    td.c { min-width: 36px; height: 40px; font-size: 10px; }
    td.c.free.sel { box-shadow: inset 0 0 0 1.5px var(--gold); }
    .rescard { padding: 14px; }
    .rescard h3 { font-size: 17px; }
    .combo { padding: 8px 10px; }
    .seg { flex: 1 1 100%; }
    .book { padding: 6px 13px; font-size: 12.5px; }
    .combototal { font-size: 13.5px; }
    .pmcard { width: 92vw; min-width: 0; }
    .gal img { height: 220px; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <h1>Villa Coliver <em>&middot; Disponibilités</em></h1>
    <p>Choisissez vos dates : nous vous montrons les logements libres, et les combinaisons possibles si aucun logement n'est libre sur toute la période.</p>
  </div>
</header>
<div class="wrap">
  <div class="searchbar">
    <div class="field"><label for="din">Arrivée</label><input type="date" id="din"></div>
    <div class="field"><label for="dout">Départ</label><input type="date" id="dout"></div>
    <button class="btn btn-primary" id="go">Voir les disponibilités</button>
    <button class="btn btn-ghost" id="clear" style="display:none">Effacer</button>
  </div>
  <div id="results"></div>
  <div class="legend">
    <span><span class="chip free"></span>Disponible (prix / nuit)</span>
    <span><span class="chip busy"></span>Occupé</span>
  </div>
  <div class="gridnav">
    <div class="title" id="gridtitle"></div>
    <button class="todaybtn" id="tod">Aujourd'hui</button>
    <button class="navbtn" id="prev">&#8249;</button>
    <button class="navbtn" id="next">&#8250;</button>
  </div>
  <div class="gridbox"><table class="cal" id="cal"></table></div>
  <div id="status"></div>
</div>
<div id="pmodal"><div class="pmcard"><button class="pmclose" data-close="1" aria-label="Fermer">&times;</button><div id="pmbody"></div></div></div>
<script>
(function () {
  var BASE = "https://flqjaqocsugwbkbiuhhk.supabase.co/functions/v1/lodgify-calendar";
  // Pages de réservation sur le site Lodgify (slug = nom complet du logement)
  var SITE = "https://coliver.lodgify.com/fr/";
  var BOOKING = {
    607741: SITE + "tiny-villa-coco--coliving-with-spa-pool-coworking",
    607742: SITE + "le-jungle-loft---villa-coliving-piscine-spa-coworking",
    607743: SITE + "chambre-nook---villa-coliving-spa-pool-coworking",
    607744: SITE + "studio-terracotta--villa-coliving-spa-pool-coworking",
    607745: SITE + "tiny-villa-litchi--coliving-with-spa-pool-coworking",
    607746: SITE + "appartement-savana---villa-coliving-spa-pool-coworking",
    607747: SITE + "chambre-sanya---villa-coliving-pool-spa-coworking",
    607748: SITE + "chambre-anjara---villa-coliving-pool-spa-coworking",
    607749: SITE + "chambre-kinoo---villa-coliving-pool-spa-coworking"
  };
  var VISIBLE = 31;        // jours affichés dans la grille
  var store = { props: [], daysById: {} };
  var viewStart = todayStr();
  var selection = null;    // {a, d} dates ISO

  function todayStr() {
    var n = new Date();
    return n.getFullYear() + "-" + p2(n.getMonth() + 1) + "-" + p2(n.getDate());
  }
  function p2(x) { return (x < 10 ? "0" : "") + x; }
  function addDays(iso, n) {
    var d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function listDays(a, b) { // [a, b) exclusif
    var out = [], c = a;
    while (c < b) { out.push(c); c = addDays(c, 1); }
    return out;
  }
  var FR_D = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
  var FR_M = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  function dow(iso) { return new Date(iso + "T00:00:00Z").getUTCDay(); }
  function dayNum(iso) { return parseInt(iso.slice(8, 10), 10); }
  function monthName(iso) { return FR_M[parseInt(iso.slice(5, 7), 10) - 1]; }
  function frDate(iso) {
    return FR_D[dow(iso)] + " " + dayNum(iso) + " " + monthName(iso);
  }
  function frShort(iso) { return dayNum(iso) + " " + monthName(iso); }

  function setStatus(msg, isErr) {
    var s = document.getElementById("status");
    s.textContent = msg || "";
    s.className = isErr ? "err" : "";
  }

  function haveRange(a, b) { // toutes les nuits [a,b) connues ?
    if (!store.props.length) return false;
    var days = listDays(a, b);
    for (var i = 0; i < store.props.length; i++) {
      var d = store.daysById[store.props[i].id] || {};
      for (var j = 0; j < days.length; j++) if (!d[days[j]]) return false;
    }
    return true;
  }

  function fetchRange(a, b, cb) {
    setStatus("Chargement des disponibilités…");
    fetch(BASE + "?data=1&start=" + a + "&end=" + b)
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (js) {
        if (js.error) throw new Error(js.error);
        store.props = js.properties.map(function (p) {
          return { id: p.id, kind: p.kind, code: p.code, minStay: p.minStay, cleaningFee: p.cleaningFee || 0, image: p.image || "", maxPeople: p.maxPeople || null, bookingUrl: BOOKING[p.id] || p.bookingUrl };
        });
        js.properties.forEach(function (p) {
          if (!store.daysById[p.id]) store.daysById[p.id] = {};
          var tgt = store.daysById[p.id];
          for (var k in p.days) tgt[k] = p.days[k];
        });
        setStatus("");
        cb();
      })
      .catch(function (e) {
        setStatus("Impossible de charger les disponibilités (" + e.message + "). Réessayez dans un instant.", true);
      });
  }

  function ensure(a, b, cb) {
    if (haveRange(a, b)) { cb(); return; }
    // marge pour limiter les allers-retours
    var end = addDays(b, 15);
    fetchRange(a, end, cb);
  }

  // ---------- grille ----------
  function renderGrid() {
    var days = [];
    for (var i = 0; i < VISIBLE; i++) days.push(addDays(viewStart, i));
    var today = todayStr();
    var selDays = selection ? listDays(selection.a, selection.d) : [];
    var selSet = {};
    selDays.forEach(function (x) { selSet[x] = 1; });

    var html = "<thead><tr><th class='room'></th>";
    // ligne des mois
    var mcells = "";
    var run = 0, runM = "";
    days.forEach(function (dd) {
      var m = monthName(dd) + " " + dd.slice(0, 4);
      if (m !== runM) {
        if (run > 0) mcells += "<th class='month' colspan='" + run + "'>" + runM + "</th>";
        runM = m; run = 0;
      }
      run++;
    });
    if (run > 0) mcells += "<th class='month' colspan='" + run + "'>" + runM + "</th>";
    html += mcells + "</tr><tr><th class='room'>Logement</th>";
    days.forEach(function (dd) {
      var w = dow(dd);
      var cls = "day" + ((w === 0 || w === 6) ? " we" : "") + (dd === today ? " today" : "");
      html += "<th class='" + cls + "'>" + FR_D[w] + "<span class='num'>" + dayNum(dd) + "</span></th>";
    });
    html += "</tr></thead><tbody>";

    store.props.forEach(function (p) {
      var d = store.daysById[p.id] || {};
      html += "<tr><td class='room'><div class='roomrow'>";
      if (p.image) html += "<img class='rthumb' src='" + p.image + "?w=160' alt='' loading='lazy' data-prop='" + p.id + "' title='Voir le logement'>";
      html += "<div class='rinfo'><div class='code'>" + esc(p.code) + "</div>";
      html += "<div class='kind'>" + esc(p.kind) + (p.maxPeople ? " &middot; " + p.maxPeople + " pers." : "") + "</div>";
      html += "<div class='rlinks'><a href='#' data-prop='" + p.id + "'>D&eacute;tails</a>";
      if (p.bookingUrl) html += "<a class='rbook' href='" + p.bookingUrl + "' target='_blank' rel='noopener'>R&eacute;server &rsaquo;</a>";
      html += "</div></div></div></td>";
      days.forEach(function (dd) {
        var cell = d[dd];
        var w = dow(dd);
        var cls, content = "", title;
        if (!cell) { cls = "c"; title = ""; }
        else if (cell.a === 1) {
          cls = "c free" + ((w === 0 || w === 6) ? " we" : "");
          content = cell.p != null ? Math.round(cell.p) + "&nbsp;€" : "&#10003;";
          title = esc(p.code) + " — " + frDate(dd) + (cell.p != null ? " — " + cell.p + " € / nuit" : " — disponible");
        } else {
          cls = "c busy";
          title = esc(p.code) + " — " + frDate(dd) + " — occupé";
        }
        if (selection) {
          if (selSet[dd]) { if (cell && cell.a === 1) cls += " sel"; }
          else cls += " dim";
        }
        html += "<td class='" + cls + "' title=\"" + title + "\">" + content + "</td>";
      });
      html += "</tr>";
    });
    html += "</tbody>";
    document.getElementById("cal").innerHTML = html;
    document.getElementById("gridtitle").textContent =
      frShort(days[0]) + " – " + frShort(days[days.length - 1]) + " " + days[days.length - 1].slice(0, 4);
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ---------- recherche / combinaisons ----------
  function nightsFree(p, days) {
    var d = store.daysById[p.id] || {};
    for (var i = 0; i < days.length; i++) {
      var c = d[days[i]];
      if (!c || c.a !== 1) return false;
    }
    return true;
  }
  function runLength(p, from, until) { // nuits consécutives dispo à partir de from, jusqu'à until (exclu)
    var d = store.daysById[p.id] || {};
    var n = 0, c = from;
    while (c < until) {
      var cell = d[c];
      if (!cell || cell.a !== 1) break;
      n++; c = addDays(c, 1);
    }
    return n;
  }
  function sumPrice(p, days) {
    var d = store.daysById[p.id] || {}, t = 0, missing = false;
    days.forEach(function (dd) {
      var c = d[dd];
      if (c && c.p != null) t += c.p; else missing = true;
    });
    return missing ? null : t;
  }

  function greedyFrom(firstProp, a, dEnd) {
    var segs = [], cur = a, guard = 0;
    var props = store.props;
    while (cur < dEnd && guard++ < 30) {
      var best = null, bestRun = 0;
      if (segs.length === 0 && firstProp) {
        best = firstProp; bestRun = runLength(firstProp, cur, dEnd);
        if (bestRun === 0) return null;
      } else {
        var prevId = segs.length ? segs[segs.length - 1].p.id : -1;
        props.forEach(function (p) {
          if (p.id === prevId) return;
          var r = runLength(p, cur, dEnd);
          if (r > bestRun) { bestRun = r; best = p; }
        });
        if (!best || bestRun === 0) return null;
      }
      var to = addDays(cur, bestRun);
      if (to > dEnd) to = dEnd;
      segs.push({ p: best, from: cur, to: to });
      cur = to;
      firstProp = null;
    }
    return cur >= dEnd ? segs : null;
  }

  function findCombos(a, dEnd) {
    var seen = {}, out = [];
    // essaie chaque logement comme premier maillon + le choix glouton pur
    var starts = [null].concat(store.props);
    starts.forEach(function (fp) {
      var segs = greedyFrom(fp, a, dEnd);
      if (!segs || segs.length < 2) return;
      var sig = segs.map(function (s) { return s.p.id + ":" + s.from; }).join("|");
      if (seen[sig]) return;
      seen[sig] = 1;
      var total = 0, totalOk = true, minStayIssue = false;
      segs.forEach(function (s) {
        var t = sumPrice(s.p, listDays(s.from, s.to));
        if (t == null) totalOk = false; else total += t + (s.p.cleaningFee || 0);
        if (listDays(s.from, s.to).length < (s.p.minStay || 1)) minStayIssue = true;
      });
      out.push({ segs: segs, total: totalOk ? total : null, minStayIssue: minStayIssue });
    });
    out.sort(function (x, y) {
      if (x.segs.length !== y.segs.length) return x.segs.length - y.segs.length;
      return (x.total == null ? 1e9 : x.total) - (y.total == null ? 1e9 : y.total);
    });
    return out.slice(0, 3);
  }

  // dates proches (même durée) quand rien n'est possible sur la période demandée
  function findAlternatives(a, dEnd) {
    var nights = listDays(a, dEnd).length;
    var t = todayStr();
    var out = [];
    for (var k = 1; k <= 14 && out.length < 3; k++) {
      var offs = [k, -k];
      for (var j = 0; j < offs.length && out.length < 3; j++) {
        var a2 = addDays(a, offs[j]);
        if (a2 < t) continue;
        var d2 = addDays(a2, nights);
        if (!haveRange(a2, d2)) continue;
        var days2 = listDays(a2, d2);
        var freeRooms = store.props.filter(function (p) { return nightsFree(p, days2); });
        if (!freeRooms.length) continue;
        var best = null, bestT = null;
        freeRooms.forEach(function (p) {
          var s = sumPrice(p, days2);
          var tot = s != null ? s + (p.cleaningFee || 0) : null;
          if (best == null || (tot != null && (bestT == null || tot < bestT))) { best = p; bestT = tot; }
        });
        out.push({ a: a2, d: d2, p: best, total: bestT, count: freeRooms.length });
      }
    }
    return out;
  }

  function renderResults(a, dEnd) {
    var days = listDays(a, dEnd);
    var nights = days.length;
    var box = document.getElementById("results");
    var html = "";
    var free = store.props.filter(function (p) { return nightsFree(p, days); });
    var combos = free.length ? [] : findCombos(a, dEnd);

    html += "<div class='rescard'><h3>Du " + frDate(a) + " au " + frDate(dEnd) + " · " + nights + " nuit" + (nights > 1 ? "s" : "") + "</h3>";

    if (free.length) {
      html += "<p style='font-size:14px;margin-bottom:4px'><strong>" + free.length + " logement" + (free.length > 1 ? "s" : "") + " disponible" + (free.length > 1 ? "s" : "") + " sur toute la période :</strong></p>";
      free.forEach(function (p) {
        var t = sumPrice(p, days);
        var fee = p.cleaningFee || 0;
        var ms = p.minStay || 1;
        html += "<div class='optline'><span class='seg'>" + esc(p.code) + "</span><span style='font-size:13px;color:#6b7280'>" + esc(p.kind) + "</span>";
        html += "<span class='tot'>" + (t != null ? Math.round(t + fee) + " € <small>total" + (fee ? ", dont " + Math.round(fee) + " € ménage" : "") + "</small>" : "") + "</span>";
        if (p.bookingUrl) html += "<a class='book' href='" + p.bookingUrl + "' target='_blank' rel='noopener'>Réserver</a>";
        html += "</div>";
        if (nights < ms) html += "<div class='note'>&#9888; Séjour minimum de " + ms + " nuits pour ce logement.</div>";
      });
    } else if (combos.length) {
      html += "<p class='empty'>Aucun logement n'est libre sur toute la période&hellip; mais voici comment y arriver en changeant de logement :</p>";
    }

    if (!free.length && !combos.length) {
      html += "<p class='empty' style='margin-top:8px'>Désolé, aucun logement (même en combinant) ne peut couvrir ces dates.</p>";
      var alts = findAlternatives(a, dEnd);
      if (alts.length) {
        html += "<div class='alttitle'>Bonne nouvelle : à quelques jours près, c'est possible &#128071;</div>";
        alts.forEach(function (al) {
          html += "<div class='optline'>";
          html += "<span class='seg'>" + esc(al.p.code) + " <small>" + frShort(al.a) + " &#8594; " + frShort(al.d) + "</small></span>";
          html += "<span class='segdet'>" + (al.total != null ? "<strong>" + Math.round(al.total) + " €</strong> <small>(ménage inclus)</small>" : "") + (al.count > 1 ? " &middot; " + al.count + " logements dispo" : "") + "</span>";
          html += "<a class='book' href='#' data-alta='" + al.a + "' data-altd='" + al.d + "'>Choisir ces dates</a>";
          html += "</div>";
        });
      } else {
        html += "<p class='empty'>Aucune disponibilité non plus à &plusmn;14 jours. Essayez une autre période ou une durée plus courte.</p>";
      }
    }
    if (combos.length && (free.length === 0)) {
      combos.forEach(function (c, ci) {
        html += "<div class='combo'>";
        if (combos.length > 1) html += "<div class='combotitle'>Option " + (ci + 1) + "</div>";
        c.segs.forEach(function (s) {
          var segDays = listDays(s.from, s.to);
          var t = sumPrice(s.p, segDays);
          var fee = s.p.cleaningFee || 0;
          html += "<div class='comboline'>";
          html += "<span class='seg' title='" + esc(s.p.kind) + "'>" + esc(s.p.code) + " <small>" + frShort(s.from) + " &#8594; " + frShort(s.to) + "</small></span>";
          html += "<span class='segdet'>" + segDays.length + " nuit" + (segDays.length > 1 ? "s" : "") + (t != null ? " &middot; <strong>" + Math.round(t + fee) + " €</strong>" + (fee ? " <small>(dont " + Math.round(fee) + " € ménage)</small>" : "") : "") + "</span>";
          if (s.p.bookingUrl) html += "<a class='book' href='" + s.p.bookingUrl + "' target='_blank' rel='noopener'>Réserver</a>";
          html += "</div>";
        });
        var hasFee = c.segs.some(function (s) { return s.p.cleaningFee; });
        html += "<div class='combototal'>Total séjour : <strong>" + (c.total != null ? Math.round(c.total) + " €" : "&mdash;") + "</strong> &middot; " + nights + " nuit" + (nights > 1 ? "s" : "") + (hasFee ? " &middot; <small>frais de ménage inclus</small>" : "") + "</div>";
        if (c.minStayIssue) html += "<div class='note'>&#9888; Certaines étapes sont plus courtes que le séjour minimum habituel — contactez-nous, on s'arrange.</div>";
        html += "</div>";
      });
      html += "<div class='note'>Les dates indiquées vont de la nuit d'arrivée au jour de départ (changement de logement ce jour-là). Réservez chaque logement séparément pour couvrir tout votre séjour.</div>";
    }
    html += "</div>";
    box.innerHTML = html;
  }

  // ---------- events ----------
  document.getElementById("go").addEventListener("click", function () {
    var a = document.getElementById("din").value;
    var d = document.getElementById("dout").value;
    if (!a || !d || d <= a) { setStatus("Choisissez une date d'arrivée puis une date de départ postérieure.", true); return; }
    var t = todayStr();
    if (a < t) { setStatus("La date d'arrivée est déjà passée.", true); return; }
    selection = { a: a, d: d };
    document.getElementById("clear").style.display = "";
    var wideA = addDays(a, -14);
    if (wideA < t) wideA = t;
    ensure(wideA, addDays(d, 14), function () {
      viewStart = a;
      renderGrid();
      renderResults(a, d);
    });
  });
  document.getElementById("clear").addEventListener("click", function () {
    selection = null;
    document.getElementById("results").innerHTML = "";
    document.getElementById("din").value = "";
    document.getElementById("dout").value = "";
    this.style.display = "none";
    renderGrid();
  });
  document.getElementById("prev").addEventListener("click", function () {
    var t = todayStr();
    var ns = addDays(viewStart, -14);
    if (ns < t) ns = t;
    viewStart = ns;
    ensure(viewStart, addDays(viewStart, VISIBLE), renderGrid);
  });
  document.getElementById("next").addEventListener("click", function () {
    viewStart = addDays(viewStart, 14);
    ensure(viewStart, addDays(viewStart, VISIBLE), renderGrid);
  });
  document.getElementById("tod").addEventListener("click", function () {
    viewStart = todayStr();
    ensure(viewStart, addDays(viewStart, VISIBLE), renderGrid);
  });
  var din = document.getElementById("din");
  din.min = todayStr();
  document.getElementById("dout").min = addDays(todayStr(), 1);
  din.addEventListener("change", function () {
    if (din.value) document.getElementById("dout").min = addDays(din.value, 1);
  });

  // ---------- fiche logement (pop-up) ----------
  var propCache = {};
  var galImgs = [], galIdx = 0;
  function openProp(id) {
    var ov = document.getElementById("pmodal");
    if (!ov) return;
    ov.style.display = "flex";
    document.body.style.overflow = "hidden";
    if (propCache[id]) { renderProp(propCache[id]); return; }
    document.getElementById("pmbody").innerHTML = "<div class='pmload'>Chargement de la fiche&hellip;</div>";
    fetch(BASE + "?prop=" + id)
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (js) { propCache[id] = js; renderProp(js); })
      .catch(function () {
        document.getElementById("pmbody").innerHTML = "<div class='pmload'>Impossible de charger la fiche pour le moment.</div>";
      });
  }
  function closeProp() {
    var ov = document.getElementById("pmodal");
    if (ov) ov.style.display = "none";
    document.body.style.overflow = "";
  }
  function renderProp(d) {
    galImgs = d.images || []; galIdx = 0;
    var html = "";
    if (galImgs.length) {
      html += "<div class='gal'><img id='galimg' src='" + galImgs[0] + "?w=1000' alt=''>";
      if (galImgs.length > 1) {
        html += "<button class='galbtn galprev' data-gal='-1'>&#8249;</button>";
        html += "<button class='galbtn galnext' data-gal='1'>&#8250;</button>";
        html += "<span class='galcount' id='galcount'>1 / " + galImgs.length + "</span>";
      }
      html += "</div>";
    }
    html += "<div class='pmbody-in'>";
    html += "<div class='pmtitle'>" + esc(d.code) + "</div>";
    html += "<div class='badges'>";
    if (d.kind) html += "<span class='badge'>" + esc(d.kind) + "</span>";
    if (d.maxPeople) html += "<span class='badge'>" + d.maxPeople + " personne" + (d.maxPeople > 1 ? "s" : "") + "</span>";
    if (d.cleaningFee) html += "<span class='badge'>M&eacute;nage " + Math.round(d.cleaningFee) + " € / s&eacute;jour</span>";
    html += "</div>";
    if (d.desc) html += "<div class='pmdesc'>" + d.desc + "</div>";
    var burl = BOOKING[d.id];
    if (burl) html += "<div class='pmfoot'><a class='book' href='" + burl + "' target='_blank' rel='noopener'>R&eacute;server ce logement &#8599;</a></div>";
    html += "</div>";
    document.getElementById("pmbody").innerHTML = html;
  }
  function galShow(delta) {
    if (!galImgs.length) return;
    galIdx = (galIdx + delta + galImgs.length) % galImgs.length;
    var im = document.getElementById("galimg");
    if (im) im.src = galImgs[galIdx] + "?w=1000";
    var ct = document.getElementById("galcount");
    if (ct) ct.textContent = (galIdx + 1) + " / " + galImgs.length;
  }
  if (document.addEventListener) {
    document.addEventListener("click", function (e) {
      var t = e.target;
      var el = t && t.closest ? t.closest("[data-prop],[data-gal],[data-close],[data-alta]") : null;
      if (el) {
        if (el.getAttribute("data-alta")) {
          e.preventDefault();
          document.getElementById("din").value = el.getAttribute("data-alta");
          document.getElementById("dout").value = el.getAttribute("data-altd");
          document.getElementById("go").click();
          return;
        }
        if (el.getAttribute("data-prop")) { e.preventDefault(); openProp(parseInt(el.getAttribute("data-prop"), 10)); return; }
        if (el.getAttribute("data-gal")) { galShow(parseInt(el.getAttribute("data-gal"), 10)); return; }
        if (el.getAttribute("data-close")) { e.preventDefault(); closeProp(); return; }
      }
      if (t && t.id === "pmodal") closeProp();
    });
    document.addEventListener("keydown", function (e) {
      var ov = document.getElementById("pmodal");
      if (!ov || ov.style.display === "none" || !ov.style.display) return;
      if (e.key === "Escape") closeProp();
      else if (e.key === "ArrowLeft") galShow(-1);
      else if (e.key === "ArrowRight") galShow(1);
    });
  }

  // premier chargement
  ensure(viewStart, addDays(viewStart, VISIBLE), renderGrid);
})();
</script>
</body>
</html>
